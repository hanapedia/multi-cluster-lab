apiVersion: v1
kind: Pod
metadata:
  name: testhttpd-__CLUSTER__-control-plane
  labels:
    app: testhttpd
    # Opt out of the default-allow rule (policy/baseline.yaml) so that
    # ingress from other clusters needs an explicit allow.
    policy.lab.hanapedia.io/default-allow: "false"
spec:
  nodeSelector:
    kubernetes.io/hostname: __CLUSTER__-control-plane
  containers:
  - name: testhttpd
    # Logs remote_ipaddr per request: that's what the cross-cluster tests check.
    image: ghcr.io/cybozu/testhttpd:0
    imagePullPolicy: IfNotPresent
    ports:
    - {name: http, containerPort: 8000}
    readinessProbe:
      httpGet: {path: /, port: http}
---
apiVersion: v1
kind: Pod
metadata:
  name: testhttpd-__CLUSTER__-worker
  labels:
    app: testhttpd
    # Opt out of the default-allow rule (policy/baseline.yaml) so that
    # ingress from other clusters needs an explicit allow.
    policy.lab.hanapedia.io/default-allow: "false"
spec:
  nodeSelector:
    kubernetes.io/hostname: __CLUSTER__-worker
  containers:
  - name: testhttpd
    # Logs remote_ipaddr per request: that's what the cross-cluster tests check.
    image: ghcr.io/cybozu/testhttpd:0
    imagePullPolicy: IfNotPresent
    ports:
    - {name: http, containerPort: 8000}
    readinessProbe:
      httpGet: {path: /, port: http}
