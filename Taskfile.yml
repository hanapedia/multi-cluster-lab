version: "3"

includes:
  coil:
    taskfile: ./coil/Taskfile.yaml
    dir: ./coil
  cilium:
    taskfile: ./cilium/Taskfile.yaml
    dir: ./cilium
  mooring:
    taskfile: ./mooring/Taskfile.yaml
    dir: ./mooring

vars:
  BIRD_VERSION: 3.2.2.1
  BIRD_IMAGE: bird:{{.BIRD_VERSION}}
  TOPOLOGY: cluster.clab.yaml
  CLUSTERS: east-edge0 east-core0
  KUBECONFIG_DIR: kubeconfig
  DEBUG_IMAGE: ghcr.io/cybozu/ubuntu-debug:24.04
  TESTHTTPD_IMAGE: ghcr.io/cybozu/testhttpd:0

  # Pod/Service CIDR variable (README: "Variables"). "unique" (default) gives
  # each cluster its own pool; "shared" reuses the same pool everywhere.
  # Override with: task deploy CIDR_MODE=shared
  CIDR_MODE: '{{.CIDR_MODE | default "unique"}}'

  POD_CIDRS_UNIQUE:
    map:
      east-edge0: 10.64.0.0/16
      east-core0: 10.65.0.0/16
  POD_CIDRS_SHARED:
    map:
      east-edge0: 10.64.0.0/16
      east-core0: 10.64.0.0/16

  SERVICE_CIDRS_UNIQUE:
    map:
      east-edge0: 10.68.0.0/16
      east-core0: 10.70.0.0/16
  SERVICE_CIDRS_SHARED:
    map:
      east-edge0: 10.68.0.0/16
      east-core0: 10.68.0.0/16

  # Cilium cluster.id (1-255), unique per cluster.
  CLUSTER_IDS:
    map:
      east-edge0: 1
      east-core0: 2

  # LB-IPAM pools. Must be unique and routable across clusters regardless
  # of CIDR_MODE, since they are the cross-cluster entry points.
  LB_CIDRS:
    map:
      east-edge0: 10.73.0.0/24
      east-core0: 10.73.1.0/24

  # Coil egress NAT pools (egress pod IPs). Must be unique and routable
  # across clusters regardless of CIDR_MODE: they are the source IPs remote
  # clusters see, i.e. what docs/network-policy.md maps to identities.
  EGRESS_CIDRS:
    map:
      east-edge0: 10.74.0.0/24
      east-core0: 10.74.1.0/24

  # Egress NAT used for cross-cluster traffic: "coil" (default) or "mooring".
  # They are mutually exclusive for now (see coil/Taskfile.yaml, task egress).
  # Switch with: task egress-nat-uninstall && task egress-nat-install EGRESS_NAT=mooring && task test-pods EGRESS_NAT=mooring
  EGRESS_NAT: '{{.EGRESS_NAT | default "coil"}}'

  # mooring NAT external IP pools. Same requirements as EGRESS_CIDRS.
  MOORING_CIDRS:
    map:
      east-edge0: 10.75.0.0/30
      east-core0: 10.75.1.0/30

tasks:
  build-bird:
    desc: Build the bird router image used by every containerlab node
    dir: bird
    cmds:
      - docker build --build-arg BIRD_VERSION={{.BIRD_VERSION}} -t {{.BIRD_IMAGE}} .
    status:
      - docker image inspect {{.BIRD_IMAGE}} >/dev/null 2>&1
    sources:
      - Dockerfile

  deploy:
    desc: Deploy the containerlab topology (builds bird first, saves kubeconfigs after)
    deps: [build-bird]
    cmds:
      - task: generate-configs
      - sudo containerlab deploy -t {{.TOPOLOGY}}
      - task: kubeconfig

  destroy:
    desc: Tear down the containerlab topology
    cmds:
      - sudo containerlab destroy -t {{.TOPOLOGY}}
      - rm -rf {{.KUBECONFIG_DIR}}

  redeploy:
    desc: Destroy and redeploy the containerlab topology (saves kubeconfigs after)
    deps: [build-bird]
    cmds:
      - task: generate-configs
      - sudo containerlab deploy -t {{.TOPOLOGY}} --reconfigure
      - task: kubeconfig

  generate-configs:
    desc: Render kind.yaml and global-router/router0.conf for the current CIDR_MODE ({{.CIDR_MODE}})
    cmds:
      - for: { var: CLUSTERS }
        cmd: >-
          sed "s|__SERVICE_CIDR__|{{if eq .CIDR_MODE "shared"}}{{index .SERVICE_CIDRS_SHARED .ITEM}}{{else}}{{index .SERVICE_CIDRS_UNIQUE .ITEM}}{{end}}|"
          {{.ITEM}}/kind.tmpl.yaml > {{.ITEM}}/kind.yaml
      - cp global-router/router0.{{.CIDR_MODE}}.conf global-router/router0.conf

  kubeconfig:
    desc: Save each cluster's kubeconfig to {{.KUBECONFIG_DIR}}/<cluster-name>.yaml
    cmds:
      - mkdir -p {{.KUBECONFIG_DIR}}
      - for: { var: CLUSTERS }
        cmd: kind get kubeconfig --name {{.ITEM}} > {{.KUBECONFIG_DIR}}/{{.ITEM}}.yaml

  cni-install:
    desc: "Install Coil + chained Cilium on every cluster (pod CIDR mode: {{.CIDR_MODE}})"
    cmds:
      - task: coil:generate-upstream-manifests
      - for: { var: CLUSTERS }
        task: coil:load-image
        vars:
          CLUSTER: "{{.ITEM}}"
      - for: { var: CLUSTERS }
        task: coil:apply
        vars:
          KUBECONFIG: "{{.ROOT_DIR}}/{{.KUBECONFIG_DIR}}/{{.ITEM}}.yaml"
      - for: { var: CLUSTERS }
        task: coil:wait
        vars:
          KUBECONFIG: "{{.ROOT_DIR}}/{{.KUBECONFIG_DIR}}/{{.ITEM}}.yaml"
          POD_CIDR: "{{if eq .CIDR_MODE \"shared\"}}{{index .POD_CIDRS_SHARED .ITEM}}{{else}}{{index .POD_CIDRS_UNIQUE .ITEM}}{{end}}"
      # Coil's CNI chain calls cilium-cni, so pods stay ContainerCreating
      # until Cilium is up.
      - task: cilium-install
      - task: egress-nat-install

  egress-nat-install:
    desc: "Install the selected egress NAT (EGRESS_NAT={{.EGRESS_NAT}}) on every cluster"
    preconditions:
      - sh: 'case "{{.EGRESS_NAT}}" in coil|mooring) ;; *) exit 1;; esac'
        msg: 'EGRESS_NAT must be "coil" or "mooring", got "{{.EGRESS_NAT}}"'
    cmds:
      - task: egress-install
        if: '[ "{{.EGRESS_NAT}}" = coil ]'
      - task: mooring-install
        if: '[ "{{.EGRESS_NAT}}" = mooring ]'

  egress-nat-uninstall:
    desc: Remove both Coil egress and mooring from every cluster (whichever is installed)
    cmds:
      - task: egress-uninstall
      - task: mooring-uninstall

  egress-uninstall:
    desc: Remove Coil egress NAT from every cluster
    cmds:
      - for: { var: CLUSTERS }
        task: coil:egress-uninstall
        vars:
          KUBECONFIG: "{{.ROOT_DIR}}/{{.KUBECONFIG_DIR}}/{{.ITEM}}.yaml"

  mooring-uninstall:
    desc: Remove mooring (and its pinned BPF programs) from every cluster
    cmds:
      - for: { var: CLUSTERS }
        task: mooring:uninstall
        vars:
          CLUSTER: "{{.ITEM}}"
          KUBECONFIG: "{{.ROOT_DIR}}/{{.KUBECONFIG_DIR}}/{{.ITEM}}.yaml"

  egress-install:
    desc: Install Coil egress NAT toward the other clusters' LB ranges on every cluster
    cmds:
      - for: { var: CLUSTERS }
        task: coil:egress
        vars:
          CLUSTER: "{{.ITEM}}"
          KUBECONFIG: "{{.ROOT_DIR}}/{{.KUBECONFIG_DIR}}/{{.ITEM}}.yaml"
          EGRESS_CIDR: "{{index .EGRESS_CIDRS .ITEM}}"
          EGRESS_DESTINATIONS: '{{$self := .ITEM}}{{range $c, $cidr := .LB_CIDRS}}{{if ne $c $self}}{{$cidr}},{{end}}{{end}}'

  cilium-install:
    desc: Install Cilium (chained after Coil, DSR L4LB, LB-IPAM + BGP) on every cluster
    cmds:
      - for: { var: CLUSTERS }
        task: cilium:load-image
        vars:
          CLUSTER: "{{.ITEM}}"
      - for: { var: CLUSTERS }
        task: cilium:generate-manifests
        vars:
          CLUSTER: "{{.ITEM}}"
          CLUSTER_ID: "{{index .CLUSTER_IDS .ITEM}}"
      - for: { var: CLUSTERS }
        task: cilium:apply
        vars:
          CLUSTER: "{{.ITEM}}"
          KUBECONFIG: "{{.ROOT_DIR}}/{{.KUBECONFIG_DIR}}/{{.ITEM}}.yaml"
      - for: { var: CLUSTERS }
        task: cilium:wait
        vars:
          KUBECONFIG: "{{.ROOT_DIR}}/{{.KUBECONFIG_DIR}}/{{.ITEM}}.yaml"
          LB_CIDR: "{{index .LB_CIDRS .ITEM}}"

  mooring-install:
    desc: Build and install mooring egress NAT (NATConfig toward the other clusters' LB ranges) on every cluster
    cmds:
      - task: mooring:build-images
      - for: { var: CLUSTERS }
        task: mooring:load-image
        vars:
          CLUSTER: "{{.ITEM}}"
      - for: { var: CLUSTERS }
        task: mooring:apply
        vars:
          CLUSTER: "{{.ITEM}}"
          KUBECONFIG: "{{.ROOT_DIR}}/{{.KUBECONFIG_DIR}}/{{.ITEM}}.yaml"
      - for: { var: CLUSTERS }
        task: mooring:wait
        vars:
          KUBECONFIG: "{{.ROOT_DIR}}/{{.KUBECONFIG_DIR}}/{{.ITEM}}.yaml"
          MOORING_CIDR: "{{index .MOORING_CIDRS .ITEM}}"
          MOORING_TARGETS: '{{$self := .ITEM}}{{range $c, $cidr := .LB_CIDRS}}{{if ne $c $self}}{{$cidr}},{{end}}{{end}}'

  policy-install:
    desc: "Install the global baseline/default-allow policy, cross-cluster allows, and CIDR groups for remote workloads (EGRESS_NAT={{.EGRESS_NAT}}) on every cluster"
    cmds:
      - for: { var: CLUSTERS }
        task: apply-policy
        vars:
          CLUSTER: "{{.ITEM}}"
          KUBECONFIG: "{{.ROOT_DIR}}/{{.KUBECONFIG_DIR}}/{{.ITEM}}.yaml"

  apply-policy:
    internal: true
    desc: "Apply policies and remote-workload CCGs to one cluster. Vars: CLUSTER, KUBECONFIG"
    cmds:
      - kubectl --kubeconfig {{.KUBECONFIG}} apply -f policy/baseline.yaml -f policy/remote-allow.yaml
      # Egress allow for the selected NAT only; the other's may reference a
      # namespace that doesn't exist (Coil's "egress").
      - kubectl --kubeconfig {{.KUBECONFIG}} delete -f policy/egress-{{if eq .EGRESS_NAT "mooring"}}coil{{else}}mooring{{end}}.yaml --ignore-not-found
      - kubectl --kubeconfig {{.KUBECONFIG}} apply -f policy/egress-{{.EGRESS_NAT}}.yaml
      # Stand-in for the mirroring controller (docs/network-policy.md): one
      # CCG per remote workload, holding the IPs it uses across clusters.
      #   debug-client:   the remote cluster's Coil egress pool (its SNAT IPs)
      #   mooring-client: the remote cluster's mooring external IP pool
      #   testhttpd:      the remote testhttpd Service's LB IP
      - |
        set -euo pipefail
        render() { sed -e "s|__NAME__|$1|" -e "s|__CLUSTER__|$2|" -e "s|__NAMESPACE__|$3|" -e "s|__APP__|$4|" -e "s|__CIDR__|$5|" policy/ccg.tmpl.yaml; }
        {{- range $remote, $egress := .EGRESS_CIDRS}}{{if ne $remote $.CLUSTER}}
        lb=$(kubectl --kubeconfig {{$.ROOT_DIR}}/{{$.KUBECONFIG_DIR}}/{{$remote}}.yaml -n default get svc testhttpd -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        test -n "$lb" || { echo "no LB IP for testhttpd in {{$remote}}" >&2; exit 1; }
        {{- if eq $.EGRESS_NAT "mooring"}}
        kubectl --kubeconfig {{$.KUBECONFIG}} delete ciliumcidrgroup {{$remote}}.default.debug-client --ignore-not-found
        { render {{$remote}}.default.mooring-client {{$remote}} default mooring-client {{index $.MOORING_CIDRS $remote}}
        {{- else}}
        kubectl --kubeconfig {{$.KUBECONFIG}} delete ciliumcidrgroup {{$remote}}.default.mooring-client --ignore-not-found
        { render {{$remote}}.default.debug-client {{$remote}} default debug-client {{$egress}}
        {{- end}}
          echo ---
          render {{$remote}}.default.testhttpd {{$remote}} default testhttpd "$lb/32"
        } | kubectl --kubeconfig {{$.KUBECONFIG}} apply -f -
        {{- end}}{{end}}

  test-pods:
    desc: "Deploy debug clients for the selected egress NAT (EGRESS_NAT={{.EGRESS_NAT}}) and a testhttpd server (behind a LoadBalancer Service) on every node"
    cmds:
      - task: docker-pull
        vars: { IMAGE_NAME: "{{.DEBUG_IMAGE}}" }
      - task: docker-pull
        vars: { IMAGE_NAME: "{{.TESTHTTPD_IMAGE}}" }
      - for: { var: CLUSTERS }
        cmd: kind load docker-image {{.DEBUG_IMAGE}} {{.TESTHTTPD_IMAGE}} --name {{.ITEM}}
      - for: { var: CLUSTERS }
        task: apply-test-pods
        vars:
          CLUSTER: "{{.ITEM}}"
          KUBECONFIG: "{{.KUBECONFIG_DIR}}/{{.ITEM}}.yaml"

  apply-test-pods:
    internal: true
    desc: "Apply and wait for the debug pods on one cluster. Vars: CLUSTER, KUBECONFIG"
    cmds:
      # Only the client pods for the selected egress NAT (EGRESS_NAT).
      - >-
        sed "s|__CLUSTER__|{{.CLUSTER}}|g" test-pods/pod.tmpl.yaml
        | yq 'select(.metadata.labels.app != "{{if eq .EGRESS_NAT "mooring"}}debug-client{{else}}mooring-client{{end}}")'
        > test-pods/pod.yaml
      # Pod specs are immutable (and the egress annotation only applies at
      # creation), so recreate the pods instead of patching them.
      - kubectl --kubeconfig {{.KUBECONFIG}} -n default delete pod -l 'app in (debug-client,mooring-client,testhttpd)' --ignore-not-found --wait
      # Workaround for a mooring bug: NATPortRange(Request)s are keyed by pod
      # name, not UID, and survive pod deletion (TIME_WAIT grace). A pod
      # recreated under the same name then keeps the old pod's IP and is never
      # SNATed. Drop the stale objects before recreating the pods.
      - |
        if kubectl --kubeconfig {{.KUBECONFIG}} get crd natportranges.hanapedia.link >/dev/null 2>&1; then
          for r in $(kubectl --kubeconfig {{.KUBECONFIG}} get natportranges.hanapedia.link -o name | grep '/default-mooring-client-'); do
            kubectl --kubeconfig {{.KUBECONFIG}} patch $r --type=merge -p '{"metadata":{"finalizers":null}}' >/dev/null
          done
          kubectl --kubeconfig {{.KUBECONFIG}} get natportrangerequests.hanapedia.link,natportranges.hanapedia.link -o name | grep '/default-mooring-client-' \
            | xargs -r kubectl --kubeconfig {{.KUBECONFIG}} delete --wait
        fi
      - kustomize build test-pods | kubectl --kubeconfig {{.KUBECONFIG}} apply -f -
      - kubectl --kubeconfig {{.KUBECONFIG}} wait pod -l 'app in (debug-client,mooring-client,testhttpd)' -n default --for=condition=Ready --timeout=120s

  docker-pull:
    desc: Pull a specified image if it doesn't exist locally
    vars:
      IMAGE_NAME: '{{.IMAGE_NAME | default "ghcr.io/cybozu/ubuntu:24.04"}}'
    cmds:
      - |
        if ! docker image inspect {{.IMAGE_NAME}} &> /dev/null; then
          docker pull --platform=linux/amd64 {{.IMAGE_NAME}}
        else
          echo "{{.IMAGE_NAME}} already exists locally, skip pulling."
        fi
