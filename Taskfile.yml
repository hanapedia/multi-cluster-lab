version: "3"

includes:
  coil:
    taskfile: ./coil/Taskfile.yaml
    dir: ./coil
  cilium:
    taskfile: ./cilium/Taskfile.yaml
    dir: ./cilium

vars:
  BIRD_VERSION: 3.2.2.1
  BIRD_IMAGE: bird:{{.BIRD_VERSION}}
  TOPOLOGY: cluster.clab.yaml
  CLUSTERS: east-edge0 east-core0
  KUBECONFIG_DIR: kubeconfig
  DEBUG_IMAGE: ghcr.io/cybozu/ubuntu-debug:24.04
  TESTHTTPD_IMAGE: ghcr.io/cybozu/testhttpd:0

  # Pod/Service CIDR variable (README: "Variables"). "unique" (default) gives
  # each cluster its own pool; "shared" reuses the same pool everywhere.
  # Override with: task deploy CIDR_MODE=shared
  CIDR_MODE: '{{.CIDR_MODE | default "unique"}}'

  POD_CIDRS_UNIQUE:
    map:
      east-edge0: 10.64.0.0/16
      east-core0: 10.65.0.0/16
  POD_CIDRS_SHARED:
    map:
      east-edge0: 10.64.0.0/16
      east-core0: 10.64.0.0/16

  SERVICE_CIDRS_UNIQUE:
    map:
      east-edge0: 10.68.0.0/16
      east-core0: 10.70.0.0/16
  SERVICE_CIDRS_SHARED:
    map:
      east-edge0: 10.68.0.0/16
      east-core0: 10.68.0.0/16

  # Cilium cluster.id (1-255), unique per cluster.
  CLUSTER_IDS:
    map:
      east-edge0: 1
      east-core0: 2

  # LB-IPAM pools. Must be unique and routable across clusters regardless
  # of CIDR_MODE, since they are the cross-cluster entry points.
  LB_CIDRS:
    map:
      east-edge0: 10.73.0.0/24
      east-core0: 10.73.1.0/24

  # Coil egress NAT pools (egress pod IPs). Must be unique and routable
  # across clusters regardless of CIDR_MODE: they are the source IPs remote
  # clusters see, i.e. what docs/network-policy.md maps to identities.
  EGRESS_CIDRS:
    map:
      east-edge0: 10.74.0.0/24
      east-core0: 10.74.1.0/24

tasks:
  build-bird:
    desc: Build the bird router image used by every containerlab node
    dir: bird
    cmds:
      - docker build --build-arg BIRD_VERSION={{.BIRD_VERSION}} -t {{.BIRD_IMAGE}} .
    status:
      - docker image inspect {{.BIRD_IMAGE}} >/dev/null 2>&1
    sources:
      - Dockerfile

  deploy:
    desc: Deploy the containerlab topology (builds bird first, saves kubeconfigs after)
    deps: [build-bird]
    cmds:
      - task: generate-configs
      - sudo containerlab deploy -t {{.TOPOLOGY}}
      - task: kubeconfig

  destroy:
    desc: Tear down the containerlab topology
    cmds:
      - sudo containerlab destroy -t {{.TOPOLOGY}}
      - rm -rf {{.KUBECONFIG_DIR}}

  redeploy:
    desc: Destroy and redeploy the containerlab topology (saves kubeconfigs after)
    deps: [build-bird]
    cmds:
      - task: generate-configs
      - sudo containerlab deploy -t {{.TOPOLOGY}} --reconfigure
      - task: kubeconfig

  generate-configs:
    desc: Render kind.yaml and global-router/router0.conf for the current CIDR_MODE ({{.CIDR_MODE}})
    cmds:
      - for: { var: CLUSTERS }
        cmd: >-
          sed "s|__SERVICE_CIDR__|{{if eq .CIDR_MODE "shared"}}{{index .SERVICE_CIDRS_SHARED .ITEM}}{{else}}{{index .SERVICE_CIDRS_UNIQUE .ITEM}}{{end}}|"
          {{.ITEM}}/kind.tmpl.yaml > {{.ITEM}}/kind.yaml
      - cp global-router/router0.{{.CIDR_MODE}}.conf global-router/router0.conf

  kubeconfig:
    desc: Save each cluster's kubeconfig to {{.KUBECONFIG_DIR}}/<cluster-name>.yaml
    cmds:
      - mkdir -p {{.KUBECONFIG_DIR}}
      - for: { var: CLUSTERS }
        cmd: kind get kubeconfig --name {{.ITEM}} > {{.KUBECONFIG_DIR}}/{{.ITEM}}.yaml

  cni-install:
    desc: "Install Coil + chained Cilium on every cluster (pod CIDR mode: {{.CIDR_MODE}})"
    cmds:
      - task: coil:generate-upstream-manifests
      - for: { var: CLUSTERS }
        task: coil:load-image
        vars:
          CLUSTER: "{{.ITEM}}"
      - for: { var: CLUSTERS }
        task: coil:apply
        vars:
          KUBECONFIG: "{{.ROOT_DIR}}/{{.KUBECONFIG_DIR}}/{{.ITEM}}.yaml"
      - for: { var: CLUSTERS }
        task: coil:wait
        vars:
          KUBECONFIG: "{{.ROOT_DIR}}/{{.KUBECONFIG_DIR}}/{{.ITEM}}.yaml"
          POD_CIDR: "{{if eq .CIDR_MODE \"shared\"}}{{index .POD_CIDRS_SHARED .ITEM}}{{else}}{{index .POD_CIDRS_UNIQUE .ITEM}}{{end}}"
      # Coil's CNI chain calls cilium-cni, so pods stay ContainerCreating
      # until Cilium is up.
      - task: cilium-install
      - task: egress-install

  egress-install:
    desc: Install Coil egress NAT toward the other clusters' LB ranges on every cluster
    cmds:
      - for: { var: CLUSTERS }
        task: coil:egress
        vars:
          KUBECONFIG: "{{.ROOT_DIR}}/{{.KUBECONFIG_DIR}}/{{.ITEM}}.yaml"
          EGRESS_CIDR: "{{index .EGRESS_CIDRS .ITEM}}"
          EGRESS_DESTINATIONS: '{{$self := .ITEM}}{{range $c, $cidr := .LB_CIDRS}}{{if ne $c $self}}{{$cidr}},{{end}}{{end}}'

  cilium-install:
    desc: Install Cilium (chained after Coil, DSR L4LB, LB-IPAM + BGP) on every cluster
    cmds:
      - for: { var: CLUSTERS }
        task: cilium:load-image
        vars:
          CLUSTER: "{{.ITEM}}"
      - for: { var: CLUSTERS }
        task: cilium:generate-manifests
        vars:
          CLUSTER: "{{.ITEM}}"
          CLUSTER_ID: "{{index .CLUSTER_IDS .ITEM}}"
      - for: { var: CLUSTERS }
        task: cilium:apply
        vars:
          CLUSTER: "{{.ITEM}}"
          KUBECONFIG: "{{.ROOT_DIR}}/{{.KUBECONFIG_DIR}}/{{.ITEM}}.yaml"
      - for: { var: CLUSTERS }
        task: cilium:wait
        vars:
          KUBECONFIG: "{{.ROOT_DIR}}/{{.KUBECONFIG_DIR}}/{{.ITEM}}.yaml"
          LB_CIDR: "{{index .LB_CIDRS .ITEM}}"

  test-pods:
    desc: Deploy an egress-NATed debug client and a testhttpd server (behind a LoadBalancer Service) on every node
    cmds:
      - task: docker-pull
        vars: { IMAGE_NAME: "{{.DEBUG_IMAGE}}" }
      - task: docker-pull
        vars: { IMAGE_NAME: "{{.TESTHTTPD_IMAGE}}" }
      - for: { var: CLUSTERS }
        cmd: kind load docker-image {{.DEBUG_IMAGE}} {{.TESTHTTPD_IMAGE}} --name {{.ITEM}}
      - for: { var: CLUSTERS }
        task: apply-test-pods
        vars:
          CLUSTER: "{{.ITEM}}"
          KUBECONFIG: "{{.KUBECONFIG_DIR}}/{{.ITEM}}.yaml"

  apply-test-pods:
    internal: true
    desc: "Apply and wait for the debug pods on one cluster. Vars: CLUSTER, KUBECONFIG"
    cmds:
      - sed "s|__CLUSTER__|{{.CLUSTER}}|g" test-pods/pod.tmpl.yaml > test-pods/pod.yaml
      # Pod specs are immutable (and the egress annotation only applies at
      # creation), so recreate the pods instead of patching them.
      - kubectl --kubeconfig {{.KUBECONFIG}} -n default delete pod -l 'app in (debug-client,testhttpd)' --ignore-not-found --wait
      - kustomize build test-pods | kubectl --kubeconfig {{.KUBECONFIG}} apply -f -
      - kubectl --kubeconfig {{.KUBECONFIG}} wait pod -l 'app in (debug-client,testhttpd)' -n default --for=condition=Ready --timeout=120s

  docker-pull:
    desc: Pull a specified image if it doesn't exist locally
    vars:
      IMAGE_NAME: '{{.IMAGE_NAME | default "ghcr.io/cybozu/ubuntu:24.04"}}'
    cmds:
      - |
        if ! docker image inspect {{.IMAGE_NAME}} &> /dev/null; then
          docker pull --platform=linux/amd64 {{.IMAGE_NAME}}
        else
          echo "{{.IMAGE_NAME}} already exists locally, skip pulling."
        fi
