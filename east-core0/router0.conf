router id 10.72.1.2;

log stderr all;

protocol device {
  scan time 10;
}

protocol kernel {
  merge paths;
  ipv4 {
    export filter {
      if source = RTS_DEVICE then reject;
        accept;
    };
  };
}

protocol bgp 'global-router0' {
  local as 65002;
  neighbor 10.72.1.1 as 65000;

  ipv4 {
    export all;
    import all;
  };
}

template bgp node {
    local as 65002;
    direct;
    passive;
    error wait time 5,20;

    ipv4 {
        import all;
        export filter {
                if proto = "direct1" then reject;
                accept;
        };
    };
}

protocol bgp 'control-plane-node' from node {
    neighbor 10.69.0.2 as 65002;
}

protocol bgp 'worker-node' from node {
    neighbor 10.69.0.3 as 65002;
}
