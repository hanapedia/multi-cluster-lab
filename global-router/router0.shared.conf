router id 10.72.0.1;

log stderr all;

protocol device {
  scan time 10;
}

protocol kernel {
    merge paths;
    ipv4 {
        export all;
    };
}

define node_subnet = 10.69.0.0/24;
define pod_subnet = 10.64.0.0/16;
define service_subnet = 10.68.0.0/16;

template bgp 'dc-router' {
  local as 65000;

  ipv4 {
    import all;
    # Every dc currently reuses node_subnet for its nodes (the overlapping
    # CIDR variable), so a dc's own node routes must not be redistributed
    # back out to other dcs or they'll shadow each dc's local connected
    # route to itself.
    #
    # Pod/Service CIDR variable: "shared" mode, so every dc also reuses
    # the same pod and service pools. Even where two dcs allocate
    # different, non-colliding blocks within the shared pool there is no
    # BGP conflict to resolve (no competing route, so AS_PATH never comes
    # into play) -- BGP would just happily cross-advertise them, silently
    # bridging the two dcs' pod/service networks. Rejecting the whole
    # pool keeps the "coincidentally reused address space" scenario
    # actually isolated between dcs, matching node_subnet above.
    export filter {
      if net ~ node_subnet then reject;
      if net ~ pod_subnet then reject;
      if net ~ service_subnet then reject;
      accept;
    };
    next hop self;
  };
}

protocol bgp 'east-edge0' from 'dc-router' {
  neighbor 10.72.0.2 as 65001;
}

protocol bgp 'east-core0' from 'dc-router' {
  neighbor 10.72.1.2 as 65002;
}
